name: Deploy Pipeline Template

on:
  workflow_call:
    inputs:
      docker-image-name:
        description: "Name of the Docker image"
        required: true
        type: string
      environment:
        description: "Environment (preprod or prod)"
        required: true
        type: string
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_ROLE_ID:
        required: true
      VAULT_SECRET_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Commit Sha
        id: var
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Fetch Vault Secrets — INFRA
        id: vault-infra
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            EVENTIUM/data/INFRA DEPLOY_HOST | DEPLOY_HOST ;
            EVENTIUM/data/INFRA DEPLOY_USER | DEPLOY_USER ;
            EVENTIUM/data/INFRA SSH_PRIVATE_KEY | SSH_PRIVATE_KEY

      - name: Fetch Vault Secrets — App
        id: vault-app
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            EVENTIUM/data/${{ inputs.environment == 'prod' && 'PROD/EVENTIUM-CLIENT-APP' || 'PREPROD/CLIENT-APP' }} DEPLOY_PATH | DEPLOY_PATH ;
            EVENTIUM/data/${{ inputs.environment == 'prod' && 'PROD/EVENTIUM-CLIENT-APP' || 'PREPROD/CLIENT-APP' }} ENV_FILE | ENV_FILE

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ steps.vault-infra.outputs.SSH_PRIVATE_KEY }}

      - name: Configure SSH Alias
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName ${{ steps.vault-infra.outputs.DEPLOY_HOST }}
            User ${{ steps.vault-infra.outputs.DEPLOY_USER }}
            StrictHostKeyChecking no
          EOF

      - name: Setup Env File
        working-directory: deploy
        run: |
          echo "${{ steps.vault-app.outputs.ENV_FILE }}" > .env
          echo "" >> .env
          echo "${{ inputs.docker-image-name }}=${{ steps.var.outputs.short_sha }}" >> .env

      - name: Setup Docker Compose File
        working-directory: deploy
        run: |
          mv docker-compose.${{ inputs.environment }}.yml docker-compose.yml

      - name: Copy Files to Server
        working-directory: deploy
        run: |
          rsync -avz .env docker-compose.yml Makefile deploy:${{ steps.vault-app.outputs.DEPLOY_PATH }}

      - name: Login to Docker AWS ECR
        run: |
          ssh deploy "aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin 102259123927.dkr.ecr.eu-west-3.amazonaws.com"

      - name: Deploy Application
        run: |
          ssh deploy "cd ${{ steps.vault-app.outputs.DEPLOY_PATH }} && make deploy-${{ inputs.environment }}"
